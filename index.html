<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENSTA Library — Course Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   ENSTA LIBRARY — design tokens
   ========================================================= */
:root{
  --bg:         #f4edda;   /* الخلفية */
  --green:      #d6dec9;   /* الأخضر الأساسي */
  --green-deep: #7d9068;   /* أخضر أغمق للأزرار والتشديد */
  --green-line: #b9c6a4;   /* حدود خفيفة */
  --ink:        #2f2b1f;   /* نص أساسي */
  --ink-soft:   #756c59;   /* نص ثانوي */
  --card:       #fffdf6;   /* خلفية البطاقات */
  --card-shadow: rgba(47,43,31,0.08);
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; }
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Tajawal', sans-serif;
  line-height:1.6;
  min-height:100vh;
}

/* ============== الرأس ============== */
.site-header{
  background:var(--bg);
  border-bottom:2px solid var(--green-line);
  padding:28px 6vw 20px;
}
.header-inner{
  max-width:1200px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.brand{ display:flex; align-items:center; gap:18px; }
.brand-mark{
  font-family:'Space Mono', monospace;
  font-weight:700;
  font-size:1.4rem;
  background:var(--green-deep);
  color:var(--card);
  width:56px; height:56px;
  border-radius:14px;
  display:flex; align-items:center; justify-content:center;
  letter-spacing:1px;
  box-shadow:4px 4px 0 var(--green-line);
}
.brand-text h1{
  font-size:1.9rem;
  font-weight:900;
  color:var(--ink);
}
.brand-text h1 span{ color:var(--green-deep); }
.brand-text p{ color:var(--ink-soft); font-size:0.92rem; margin-top:2px; }

.header-right{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

/* ============== Language switch ============== */
.lang-switch{
  display:flex;
  background:var(--green);
  border:1px solid var(--green-line);
  border-radius:20px;
  padding:3px;
  gap:2px;
}
.lang-btn{
  font-family:'Space Mono', monospace;
  font-size:0.78rem;
  font-weight:700;
  border:none;
  background:transparent;
  color:var(--ink-soft);
  padding:6px 14px;
  border-radius:16px;
  cursor:pointer;
  transition:all .15s ease;
}
.lang-btn:hover{ color:var(--ink); }
.lang-btn.active{ background:var(--green-deep); color:var(--card); }

/* ============== شريط التبويبات للسنوات ============== */
.cycle-tabs{
  max-width:1200px;
  margin:26px auto 0;
  padding:0 6vw;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.tab{
  font-family:'Tajawal', sans-serif;
  cursor:pointer;
  border:2px solid var(--green-line);
  border-bottom:none;
  background:var(--green);
  color:var(--ink-soft);
  padding:12px 20px 14px;
  border-radius:14px 14px 0 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:2px;
  transform:translateY(8px);
  transition:all .18s ease;
}
.tab:hover{ transform:translateY(2px); color:var(--ink); }
.tab.active{
  background:var(--card);
  color:var(--ink);
  transform:translateY(0);
  border-color:var(--green-line);
  box-shadow:0 -4px 0 0 var(--green-deep) inset;
  font-weight:700;
}
.tab-code{ font-family:'Space Mono', monospace; font-weight:700; font-size:1rem; }
.tab-label{ font-size:0.72rem; opacity:.85; }

/* ============== المحتوى الرئيسي ============== */
.content{
  max-width:1200px;
  margin:0 auto;
  background:var(--card);
  border:2px solid var(--green-line);
  border-radius:0 18px 18px 18px;
  padding:36px 6vw 60px;
  margin-inline:6vw;
  box-shadow:0 12px 30px var(--card-shadow);
}
@media(min-width:1212px){ .content{ margin-inline:auto; padding:36px 48px 60px; } }

.panel-head{
  border-bottom:2px dashed var(--green-line);
  padding-bottom:16px;
  margin-bottom:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:16px;
}
.panel-head h2{ font-size:1.5rem; font-weight:900; display:flex; align-items:center; gap:12px; }
.panel-code{
  font-family:'Space Mono', monospace;
  font-size:0.85rem;
  background:var(--green);
  color:var(--green-deep);
  padding:4px 10px;
  border-radius:8px;
  font-weight:700;
}

/* ============== تبويبات السداسي ============== */
.semester-filter{
  display:flex;
  background:var(--bg);
  padding:4px;
  border-radius:12px;
  border:1px solid var(--green-line);
  gap:4px;
}
.sem-btn{
  border:none;
  background:transparent;
  padding:6px 16px;
  border-radius:8px;
  font-weight:700;
  font-size:0.85rem;
  cursor:pointer;
  color:var(--ink-soft);
  transition:all .15s ease;
  font-family:'Space Mono', monospace;
}
.sem-btn.active{
  background:var(--green-deep);
  color:var(--card);
}

/* ============== شبكة بطاقات المقاييس ============== */
.module-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:20px;
}

.module-card{
  background:var(--bg);
  border:1.5px solid var(--green-line);
  border-radius:16px;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  transition:all .15s ease;
}
.module-card:hover{
  transform:translateY(-4px);
  border-color:var(--green-deep);
  box-shadow:0 10px 22px var(--card-shadow);
}

.card-top{ display:flex; align-items:center; gap:10px; }
.card-index{
  font-family:'Space Mono', monospace;
  font-size:0.75rem;
  color:var(--card);
  background:var(--green-deep);
  width:28px; height:28px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.module-title{ font-size:1.05rem; font-weight:700; color:var(--ink); }
.sem-badge{
  font-family:'Space Mono', monospace;
  font-size:0.7rem;
  padding:2px 6px;
  background:var(--green);
  color:var(--green-deep);
  border-radius:4px;
  margin-left:auto;
}

.module-desc{ color:var(--ink-soft); font-size:0.88rem; flex-grow:1; }

.module-btn{
  align-self:flex-start;
  display:inline-flex;
  align-items:center;
  gap:8px;
  text-decoration:none;
  background:var(--green-deep);
  color:var(--card);
  font-weight:700;
  font-size:0.85rem;
  padding:9px 16px;
  border-radius:10px;
  transition:all .15s ease;
}
.module-btn:hover{ background:var(--ink); transform:translateY(-2px); }

.empty-msg{
  grid-column: 1 / -1;
  text-align: center;
  padding: 40px;
  color: var(--ink-soft);
  font-size: 1rem;
}

/* ============== التذييل ============== */
.site-footer{
  text-align:center;
  color:var(--ink-soft);
  font-size:0.85rem;
  padding:30px 6vw 40px;
}
</style>
</head>
<body>

  <!-- ===================== Header ===================== -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-mark">EN</span>
        <div class="brand-text">
          <h1>ENSTA <span>Library</span></h1>
          <p data-i18n="brandDesc">Archive des modules et résumés — des étudiants pour les étudiants</p>
        </div>
      </div>

      <div class="header-right">
        <div class="lang-switch" id="langSwitch">
          <button class="lang-btn active" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== Cycle tabs ===================== -->
  <nav class="cycle-tabs" id="cycleTabs">
    <button class="tab active" data-year="cp1"><span class="tab-code">CP1</span><span class="tab-label" data-i18n="cp1Tab">Prépa 1</span></button>
    <button class="tab" data-year="cp2"><span class="tab-code">CP2</span><span class="tab-label" data-i18n="cp2Tab">Prépa 2</span></button>
    <button class="tab" data-year="cs1"><span class="tab-code">CS1</span><span class="tab-label" data-i18n="cs1Tab">Spécialité 1</span></button>
    <button class="tab" data-year="cs2"><span class="tab-code">CS2</span><span class="tab-label" data-i18n="cs2Tab">Spécialité 2</span></button>
    <button class="tab" data-year="cs3"><span class="tab-code">CS3</span><span class="tab-label" data-i18n="cs3Tab">Spécialité 3</span></button>
    <button class="tab" data-year="cs4"><span class="tab-code">CS4</span><span class="tab-label" data-i18n="cs4Tab">Spécialité 4</span></button>
    <button class="tab" data-year="cs5"><span class="tab-code">CS5</span><span class="tab-label" data-i18n="cs5Tab">Spécialité 5</span></button>
  </nav>

  <!-- ===================== Main Container ===================== -->
  <main class="content">
    <div class="panel-head">
      <h2>
        <span id="yearTitle">Première année préparatoire</span> 
        <span class="panel-code" id="yearCode">CP1</span>
      </h2>
      
      <!-- أزرار اختيار السداسي -->
      <div class="semester-filter" id="semFilter">

        <button class="sem-btn" id="semBtn1" data-sem="s1">S1</button>
        <button class="sem-btn" id="semBtn2" data-sem="s2">S2</button>
      </div>
    </div>

    <!-- شبكة عرض المواد تظهر هنا تلقائياً -->
    <div class="module-grid" id="moduleGrid"></div>
  </main>

  <footer class="site-footer">
    <p data-i18n="footer">ENSTA Library — Fait par les étudiants, pour les étudiants</p>
  </footer>

  <script>
/* =======================================================================
   1. قائمة المواد
   ======================================================================= */

  {

    driveUrl: "https://drive.google.com/drive/folders/1ZKQ1KQUC9XaEkQI-HhpQIHSRjQl9iBVw?usp=sharing"
  },
  {

    driveUrl: "https://drive.google.com/drive/folders/1QL3rUXfbWLz9OG43wgoh5UBl7AaarP65?usp=sharing"
  },
  {

    driveUrl: "https://drive.google.com/drive/folders/1ej-2hpDRrVyptuO9bWdZ-8IVSzTd-S95?usp=sharing"
  },
  {
    year: "cp1",

    title: "Linux",
    desc: "Introduction au système Linux, lignes de commande et shell scripting.",
    driveUrl: "https://drive.google.com/drive/folders/1ECAsznqr3PTmER0xz21k9vNKK4TlLtSt?usp=sharing"
  },
  {
    year: "cp1",
    semester: "s2",
    title: "Electro 2",
    desc: "Régime sinusoïdal, filtres et composants électroniques de base.",
    driveUrl: "https://drive.google.com/drive/folders/1C41SzoihUpmHHoVBfJsbnudwuS6cN-7A?usp=sharing"
  },
  {
    year: "cp1",
    semester: "s2",
    title: "Assembly",
    desc: "Programmation en langage d'assemblage et gestion de la mémoire.",
    driveUrl: "https://drive.google.com/drive/folders/1zqbA8WGII_prKmqBWlI5K7pCHn8tTHHe?usp=sharing"
  },
  {

  },
  {

  },
  {
    year: "cp2",
    semester: "s3",
    title: "Analyse 3",
    desc: "Séries numériques, séries de fonctions et intégrales multiples.",
    driveUrl: "https://drive.google.com/drive/folders/1exqkBIbTp8BPAsan8yz_TkZ-8U3GlqkY?usp=sharing"
  },

/* =======================================================================
   2. ترجمات الصفحة
   ======================================================================= */
const translations = {
  fr: {
    brandDesc: "Archive des modules et résumés — des étudiants pour les étudiants",
    cp1Tab: "Prépa 1", cp2Tab: "Prépa 2", cs1Tab: "Spécialité 1", cs2Tab: "Spécialité 2",
    cs3Tab: "Spécialité 3", cs4Tab: "Spécialité 4", cs5Tab: "Spécialité 5",
    cp1Title: "Première année préparatoire", cp2Title: "Deuxième année préparatoire",
    cs1Title: "Première année de spécialité", cs2Title: "Deuxième année de spécialité",
    cs3Title: "Troisième année de spécialité", cs4Title: "Quatrième année de spécialité",
    cs5Title: "Cinquième année de spécialité",
    moduleBtn: "Ouvrir le dossier",
    emptyMsg: "Aucun module disponible pour cette sélection.",
    footer: "ENSTA Library — Fait par les étudiants, pour les étudiants"
  },
  en: {
    brandDesc: "Course archive and summaries — by students, for students",
    cp1Tab: "Prep 1", cp2Tab: "Prep 2", cs1Tab: "Specialty 1", cs2Tab: "Specialty 2",
    cs3Tab: "Specialty 3", cs4Tab: "Specialty 4", cs5Tab: "Specialty 5",
    cp1Title: "First preparatory year", cp2Title: "Second preparatory year",
    cs1Title: "First specialty year", cs2Title: "Second specialty year",
    cs3Title: "Third specialty year", cs4Title: "Fourth specialty year",
    cs5Title: "Fifth specialty year",
    moduleBtn: "Open folder",
    emptyMsg: "No modules available for this selection.",
    footer: "ENSTA Library — Made by students, for students"
  }
};

let currentYear = "cp1";
let currentSem = "all";
let currentLang = localStorage.getItem("ensta-library-lang") || "fr";

/* =======================================================================
   3. الوظائف البرمجية (Logic)
   ======================================================================= */
function updateSemesterFilterButtons() {
  const semBtn1 = document.getElementById("semBtn1");
  const semBtn2 = document.getElementById("semBtn2");
  
  if (currentYear === "cp1") {
    semBtn1.textContent = "S1";
    semBtn1.setAttribute("data-sem", "s1");
    semBtn2.textContent = "S2";
    semBtn2.setAttribute("data-sem", "s2");
  } else if (currentYear === "cp2") {
    semBtn1.textContent = "S3";
    semBtn1.setAttribute("data-sem", "s3");
    semBtn2.textContent = "S4";
    semBtn2.setAttribute("data-sem", "s4");
  } else {
    semBtn1.textContent = "S1";
    semBtn1.setAttribute("data-sem", "s1");
    semBtn2.textContent = "S2";
    semBtn2.setAttribute("data-sem", "s2");
  }
}

function renderModules() {
  const grid = document.getElementById("moduleGrid");
  const dict = translations[currentLang];
  grid.innerHTML = "";

  // فلترة المواد بناءً على السنة والسداسي المحدد
  const filtered = COURSES_DATA.filter(item => {
    const matchYear = item.year === currentYear;
    const matchSem = currentSem === "all" || item.semester === currentSem;
    return matchYear && matchSem;
  });

  if (filtered.length === 0) {
    grid.innerHTML = `<div class="empty-msg">${dict.emptyMsg}</div>`;
    return;
  }

  filtered.forEach((mod, index) => {
    const card = document.createElement("article");
    card.className = "module-card";
    
    // تنسيق رقم البطاقة (01, 02...)
    const num = String(index + 1).padStart(2, '0');

    card.innerHTML = `
      <div class="card-top">
        <span class="card-index">${num}</span>
        <h3 class="module-title">${mod.title}</h3>
        <span class="sem-badge">${mod.semester.toUpperCase()}</span>
      </div>
      <p class="module-desc">${mod.desc}</p>
      <a class="module-btn" href="${mod.driveUrl}" target="_blank" rel="noopener">
        <span>${dict.moduleBtn}</span>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M7 17L17 7M17 7H9M17 7V15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
    `;
    grid.appendChild(card);
  });
}

function updateHeaderTitle() {
  const dict = translations[currentLang];
  const titleEl = document.getElementById("yearTitle");
  const codeEl = document.getElementById("yearCode");
  
  titleEl.textContent = dict[`${currentYear}Title`];
  codeEl.textContent = currentYear.toUpperCase();
}

function applyLanguage(lang) {
  currentLang = lang;
  const dict = translations[lang] || translations.fr;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (dict[key]) el.textContent = dict[key];
  });

  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
  });

  updateHeaderTitle();
  renderModules();

  try { localStorage.setItem("ensta-library-lang", lang); } catch (e) {}
}

// تهيئة الأحداث (Event Listeners)
document.addEventListener("DOMContentLoaded", () => {
  // تبديل السنوات (CP1, CP2...)
  document.getElementById("cycleTabs").addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (!tab) return;
    
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    tab.classList.add("active");

    currentYear = tab.getAttribute("data-year");
    currentSem = "all";
    
    document.querySelectorAll(".sem-btn").forEach(b => b.classList.remove("active"));
    document.querySelector('.sem-btn[data-sem="all"]').classList.add("active");

    updateSemesterFilterButtons();
    updateHeaderTitle();
    renderModules();
  });

  // تبديل السداسيات
  document.getElementById("semFilter").addEventListener("click", e => {
    const btn = e.target.closest(".sem-btn");
    if (!btn) return;

    document.querySelectorAll(".sem-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    currentSem = btn.getAttribute("data-sem");
    renderModules();
  });

  // تبديل اللغة (FR / EN)
  document.getElementById("langSwitch").addEventListener("click", e => {
    const btn = e.target.closest(".lang-btn");
    if (btn) applyLanguage(btn.getAttribute("data-lang"));
  });

  // التشغيل الأول
  updateSemesterFilterButtons();
  applyLanguage(currentLang);
});
</script>
</body>
</html>
